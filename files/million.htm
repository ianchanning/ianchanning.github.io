<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Leak Ledger</title>
  
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { margin: 0; padding: 0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    // Polyfill window.storage to use browser localStorage
    if (!window.storage) {
      window.storage = {
        get: async (key) => {
          const val = localStorage.getItem(key);
          return val ? { value: val } : null;
        },
        set: async (key, value) => {
          localStorage.setItem(key, value);
          return true;
        }
      };
    }

    // ---------- Inline SVG Icons ----------
    const Icon = ({ size = 16, children, style }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={style}>
        {children}
      </svg>
    );

    const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>;
    const Pencil = (p) => <Icon {...p}><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></Icon>;
    const Trash2 = (p) => <Icon {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></Icon>;
    const X = (p) => <Icon {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Icon>;
    const Check = (p) => <Icon {...p}><polyline points="20 6 9 17 4 12"/></Icon>;
    const Droplets = (p) => <Icon {...p}><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7 6.8 7 6.8s-2.29 2.26-3.29 3.26S2 11.09 2 12.25c0 2.22 1.8 4.05 4 4.05z"/><path d="M12.56 6.6A10.97 10.97 0 0 0 14 3s2.3 2.3 3.3 3.3c1.1 1 1.7 2.1 1.7 3.25 0 2.22-1.8 4.05-4 4.05s-4-1.83-4-4.05c0-.98.42-1.95 1.56-2.9z"/></Icon>;

    // ---------- Helpers ----------
    const CYCLES = {
      weekly: { label: "weekly", perMonth: (a) => (a * 52) / 12, perYear: (a) => a * 52 },
      monthly: { label: "monthly", perMonth: (a) => a, perYear: (a) => a * 12 },
      yearly: { label: "yearly", perMonth: (a) => a / 12, perYear: (a) => a },
    };

    const CATEGORIES = ["Streaming", "Software", "Fitness", "News & Reading", "Cloud & Storage", "Other"];

    function addCycle(date, cycle) {
      const d = new Date(date);
      if (cycle === "weekly") d.setDate(d.getDate() + 7);
      if (cycle === "monthly") d.setMonth(d.getMonth() + 1);
      if (cycle === "yearly") d.setFullYear(d.getFullYear() + 1);
      return d;
    }

    function nextOccurrence(dateStr, cycle) {
      let d = new Date(dateStr + "T00:00:00");
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      if (isNaN(d.getTime())) return dateStr;
      let guard = 0;
      while (d < today && guard < 200) {
        d = addCycle(d, cycle);
        guard++;
      }
      return d.toISOString().slice(0, 10);
    }

    function daysUntil(dateStr) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const d = new Date(dateStr + "T00:00:00");
      return Math.round((d - today) / 86400000);
    }

    function fmtDate(dateStr) {
      const d = new Date(dateStr + "T00:00:00");
      return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
    }

    function fmtMoney(n) {
      return n.toLocaleString("en-US", { style: "currency", currency: "USD" });
    }

    function uid() {
      return Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    }

    const emptyForm = { name: "", amount: "", cycle: "monthly", category: "Streaming", nextRenewal: "" };

    function LeakLedger() {
      const [entries, setEntries] = useState([]);
      const [loaded, setLoaded] = useState(false);
      const [saveError, setSaveError] = useState(false);
      const [formOpen, setFormOpen] = useState(false);
      const [editingId, setEditingId] = useState(null);
      const [form, setForm] = useState(emptyForm);
      const [confirmResetOpen, setConfirmResetOpen] = useState(false);

      useEffect(() => {
        (async () => {
          try {
            const res = await window.storage.get("subscriptions");
            if (res && res.value) {
              setEntries(JSON.parse(res.value));
            }
          } catch (e) {
          } finally {
            setLoaded(true);
          }
        })();
      }, []);

      const persist = useCallback(async (next) => {
        try {
          const result = await window.storage.set("subscriptions", JSON.stringify(next));
          if (!result) setSaveError(true);
          else setSaveError(false);
        } catch (e) {
          setSaveError(true);
        }
      }, []);

      const saveEntries = useCallback(
        (updater) => {
          setEntries((prev) => {
            const next = typeof updater === "function" ? updater(prev) : updater;
            persist(next);
            return next;
          });
        },
        [persist]
      );

      const openNew = () => {
        setForm({ ...emptyForm, nextRenewal: new Date().toISOString().slice(0, 10) });
        setEditingId(null);
        setFormOpen(true);
      };

      const openEdit = (entry) => {
        setForm({
          name: entry.name,
          amount: String(entry.amount),
          cycle: entry.cycle,
          category: entry.category,
          nextRenewal: entry.nextRenewal,
        });
        setEditingId(entry.id);
        setFormOpen(true);
      };

      const closeForm = () => {
        setFormOpen(false);
        setEditingId(null);
        setForm(emptyForm);
      };

      const submitForm = (e) => {
        e.preventDefault();
        const amt = parseFloat(form.amount);
        if (!form.name.trim() || isNaN(amt) || amt <= 0 || !form.nextRenewal) return;
        const normalized = nextOccurrence(form.nextRenewal, form.cycle);
        if (editingId) {
          saveEntries((prev) =>
            prev.map((en) =>
              en.id === editingId
                ? { ...en, name: form.name.trim(), amount: amt, cycle: form.cycle, category: form.category, nextRenewal: normalized }
                : en
            )
          );
        } else {
          saveEntries((prev) => [
            ...prev,
            { id: uid(), name: form.name.trim(), amount: amt, cycle: form.cycle, category: form.category, nextRenewal: normalized },
          ]);
        }
        closeForm();
      };

      const removeEntry = (id) => {
        saveEntries((prev) => prev.filter((e) => e.id !== id));
      };

      const resetAll = () => {
        saveEntries([]);
        setConfirmResetOpen(false);
      };

      const normalizedEntries = useMemo(
        () =>
          entries
            .map((e) => ({ ...e, nextRenewal: nextOccurrence(e.nextRenewal, e.cycle) }))
            .sort((a, b) => daysUntil(a.nextRenewal) - daysUntil(b.nextRenewal)),
        [entries]
      );

      const totalMonthly = normalizedEntries.reduce((sum, e) => sum + CYCLES[e.cycle].perMonth(e.amount), 0);
      const totalYearly = normalizedEntries.reduce((sum, e) => sum + CYCLES[e.cycle].perYear(e.amount), 0);
      const dueSoonCount = normalizedEntries.filter((e) => daysUntil(e.nextRenewal) <= 7).length;

      const categoryTotals = useMemo(() => {
        const map = {};
        normalizedEntries.forEach((e) => {
          const m = CYCLES[e.cycle].perMonth(e.amount);
          map[e.category] = (map[e.category] || 0) + m;
        });
        return Object.entries(map).sort((a, b) => b[1] - a[1]);
      }, [normalizedEntries]);
      const maxCategoryTotal = categoryTotals.length ? categoryTotals[0][1] : 0;

      return (
        <div className="ll-root">
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');

            .ll-root {
              --paper: #EDEFE3;
              --paper-card: #F8F8F1;
              --line: #B7C7AE;
              --ink: #24352C;
              --ink-soft: #4C5F53;
              --stamp: #A63A2E;
              --gold: #B8922A;
              --gold-soft: #DCC77A;
              min-height: 100vh;
              background:
                repeating-linear-gradient(var(--paper), var(--paper) 31px, var(--line) 32px),
                var(--paper);
              color: var(--ink);
              font-family: 'Inter', sans-serif;
              padding: 28px 16px 64px;
            }
            @media (min-width: 640px) { .ll-root { padding: 44px 32px 80px; } }

            .ll-wrap { max-width: 820px; margin: 0 auto; position: relative; }

            .ll-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 8px; }
            .ll-title { font-family: 'Special Elite', monospace; font-size: 28px; letter-spacing: 0.5px; color: var(--ink); }
            .ll-subtitle { font-size: 13px; color: var(--ink-soft); margin-top: 4px; max-width: 40ch; }

            .ll-stamp {
              flex-shrink: 0; width: 92px; height: 92px; border-radius: 50%;
              border: 2.5px solid var(--stamp); color: var(--stamp);
              display: flex; flex-direction: column; align-items: center; justify-content: center;
              transform: rotate(-9deg); font-family: 'Special Elite', monospace;
              box-shadow: inset 0 0 0 3px rgba(166,58,46,0.15);
              text-align: center; line-height: 1.1;
            }
            .ll-stamp-amt { font-size: 15px; font-weight: 700; }
            .ll-stamp-label { font-size: 8px; letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }

            .ll-stats { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin: 22px 0 26px; }
            @media (min-width: 560px) { .ll-stats { grid-template-columns: repeat(4,1fr); } }
            .ll-stat { background: var(--paper-card); border: 1px solid var(--line); padding: 10px 12px; }
            .ll-stat-val { font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 18px; }
            .ll-stat-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--ink-soft); margin-top: 2px; }

            .ll-section-label { font-family: 'Special Elite', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--ink-soft); border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }

            .ll-addbtn { display: inline-flex; align-items: center; gap: 6px; background: var(--ink); color: var(--paper); border: none; padding: 7px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
            .ll-addbtn:hover { background: #1a271f; }
            .ll-addbtn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

            .ll-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px 4px; border-bottom: 1px dashed var(--line); }
            .ll-row-main { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
            .ll-row-name { font-weight: 600; font-size: 14.5px; }
            .ll-row-meta { font-size: 11.5px; color: var(--ink-soft); }
            .ll-tag { font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px; border: 1px solid var(--line); padding: 1px 6px; color: var(--ink-soft); }
            .ll-due { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--stamp); border: 1px solid var(--stamp); padding: 1px 6px; transform: rotate(-3deg); display: inline-block; }
            .ll-amt { font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 15px; text-align: right; }
            .ll-amt-sub { font-family: 'Courier Prime', monospace; font-size: 10.5px; color: var(--ink-soft); text-align: right; }
            .ll-actions { display: flex; gap: 4px; margin-left: 8px; }
            .ll-iconbtn { background: none; border: 1px solid transparent; padding: 5px; cursor: pointer; color: var(--ink-soft); }
            .ll-iconbtn:hover { color: var(--ink); border-color: var(--line); }
            .ll-iconbtn:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }

            .ll-empty { padding: 32px 12px; text-align: center; color: var(--ink-soft); font-size: 13.5px; border: 1px dashed var(--line); margin-top: 10px; }

            .ll-form { background: var(--paper-card); border: 1px solid var(--line); padding: 16px; margin-top: 10px; }
            .ll-field { margin-bottom: 12px; }
            .ll-field label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft); margin-bottom: 4px; }
            .ll-field input, .ll-field select {
              width: 100%; background: var(--paper); border: none; border-bottom: 1.5px solid var(--ink);
              padding: 7px 4px; font-size: 14px; font-family: 'Inter', sans-serif; color: var(--ink);
            }
            .ll-field input:focus, .ll-field select:focus { outline: none; border-bottom-color: var(--gold); }
            .ll-formrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
            .ll-formbtns { display: flex; gap: 8px; margin-top: 4px; }
            .ll-btn-primary { background: var(--ink); color: var(--paper); border: none; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
            .ll-btn-primary:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
            .ll-btn-ghost { background: none; color: var(--ink-soft); border: 1px solid var(--line); padding: 8px 16px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
            .ll-btn-ghost:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

            .ll-catbar-track { background: var(--line); height: 6px; width: 100%; margin-top: 4px; }
            .ll-catbar-fill { background: var(--gold); height: 6px; }
            .ll-cat-row { padding: 8px 2px; }
            .ll-cat-top { display: flex; justify-content: space-between; font-size: 12.5px; }

            .ll-footer { margin-top: 30px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--ink-soft); }
            .ll-reset { background: none; border: none; text-decoration: underline; cursor: pointer; color: var(--ink-soft); font-size: 11px; }
            .ll-reset:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

            .ll-modal-backdrop { position: fixed; inset: 0; background: rgba(36,53,44,0.4); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
            .ll-modal { background: var(--paper-card); border: 1px solid var(--line); padding: 20px; max-width: 340px; width: 100%; }
            .ll-modal h3 { font-family: 'Special Elite', monospace; font-size: 15px; margin-bottom: 8px; }
            .ll-modal p { font-size: 13px; color: var(--ink-soft); margin-bottom: 16px; }

            .ll-error { font-size: 11px; color: var(--stamp); margin-top: 8px; }

            @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
          `}</style>

          <div className="ll-wrap">
            <header className="ll-header">
              <div>
                <div className="ll-title">The Leak Ledger</div>
                <div className="ll-subtitle">Every recurring charge, entered by hand — so nothing drains quietly.</div>
              </div>
              <div className="ll-stamp">
                <Droplets size={14} style={{ marginBottom: 2 }} />
                <div className="ll-stamp-amt">{fmtMoney(totalMonthly)}</div>
                <div className="ll-stamp-label">per month</div>
              </div>
            </header>

            <div className="ll-stats">
              <div className="ll-stat">
                <div className="ll-stat-val">{fmtMoney(totalMonthly)}</div>
                <div className="ll-stat-label">Monthly outflow</div>
              </div>
              <div className="ll-stat">
                <div className="ll-stat-val">{fmtMoney(totalYearly)}</div>
                <div className="ll-stat-label">Yearly outflow</div>
              </div>
              <div className="ll-stat">
                <div className="ll-stat-val">{normalizedEntries.length}</div>
                <div className="ll-stat-label">Active entries</div>
              </div>
              <div className="ll-stat">
                <div className="ll-stat-val">{dueSoonCount}</div>
                <div className="ll-stat-label">Due in 7 days</div>
              </div>
            </div>

            <div className="ll-section-label">
              <span>Ledger entries</span>
              {!formOpen && (
                <button className="ll-addbtn" onClick={openNew}>
                  <Plus size={13} /> New entry
                </button>
              )}
            </div>

            {formOpen && (
              <form className="ll-form" onSubmit={submitForm}>
                <div className="ll-field">
                  <label htmlFor="ll-name">Name</label>
                  <input
                    id="ll-name"
                    autoFocus
                    value={form.name}
                    onChange={(e) => setForm((f) => ({ ...f, name: e.target.value }))}
                    placeholder="e.g. Streaming service"
                    required
                  />
                </div>
                <div className="ll-formrow">
                  <div className="ll-field">
                    <label htmlFor="ll-amt">Amount</label>
                    <input
                      id="ll-amt"
                      type="number"
                      min="0.01"
                      step="0.01"
                      value={form.amount}
                      onChange={(e) => setForm((f) => ({ ...f, amount: e.target.value }))}
                      placeholder="0.00"
                      required
                    />
                  </div>
                  <div className="ll-field">
                    <label htmlFor="ll-cycle">Billed</label>
                    <select id="ll-cycle" value={form.cycle} onChange={(e) => setForm((f) => ({ ...f, cycle: e.target.value }))}>
                      <option value="weekly">Weekly</option>
                      <option value="monthly">Monthly</option>
                      <option value="yearly">Yearly</option>
                    </select>
                  </div>
                </div>
                <div className="ll-formrow">
                  <div className="ll-field">
                    <label htmlFor="ll-cat">Category</label>
                    <select id="ll-cat" value={form.category} onChange={(e) => setForm((f) => ({ ...f, category: e.target.value }))}>
                      {CATEGORIES.map((c) => (
                        <option key={c} value={c}>{c}</option>
                      ))}
                    </select>
                  </div>
                  <div className="ll-field">
                    <label htmlFor="ll-date">Next renewal</label>
                    <input
                      id="ll-date"
                      type="date"
                      value={form.nextRenewal}
                      onChange={(e) => setForm((f) => ({ ...f, nextRenewal: e.target.value }))}
                      required
                    />
                  </div>
                </div>
                <div className="ll-formbtns">
                  <button type="submit" className="ll-btn-primary">
                    <Check size={14} /> {editingId ? "Save changes" : "Add entry"}
                  </button>
                  <button type="button" className="ll-btn-ghost" onClick={closeForm}>
                    <X size={14} /> Cancel
                  </button>
                </div>
                {saveError && <div className="ll-error">Couldn't save just now — your entry may not persist. Try again.</div>}
              </form>
            )}

            {!loaded ? (
              <div className="ll-empty">Opening the ledger…</div>
            ) : normalizedEntries.length === 0 && !formOpen ? (
              <div className="ll-empty">Nothing recorded yet. Add your first subscription above.</div>
            ) : (
              <div>
                {normalizedEntries.map((e) => {
                  const dLeft = daysUntil(e.nextRenewal);
                  const monthlyEquiv = CYCLES[e.cycle].perMonth(e.amount);
                  return (
                    <div className="ll-row" key={e.id}>
                      <div>
                        <div className="ll-row-main">
                          <span className="ll-row-name">{e.name}</span>
                          <span className="ll-tag">{e.category}</span>
                          {dLeft <= 7 && <span className="ll-due">due {dLeft <= 0 ? "today" : `in ${dLeft}d`}</span>}
                        </div>
                        <div className="ll-row-meta">
                          {CYCLES[e.cycle].label} · renews {fmtDate(e.nextRenewal)}
                        </div>
                      </div>
                      <div style={{ display: "flex", alignItems: "center" }}>
                        <div>
                          <div className="ll-amt">{fmtMoney(e.amount)}</div>
                          {e.cycle !== "monthly" && <div className="ll-amt-sub">≈ {fmtMoney(monthlyEquiv)}/mo</div>}
                        </div>
                        <div className="ll-actions">
                          <button className="ll-iconbtn" onClick={() => openEdit(e)} aria-label={`Edit ${e.name}`}>
                            <Pencil size={14} />
                          </button>
                          <button className="ll-iconbtn" onClick={() => removeEntry(e.id)} aria-label={`Delete ${e.name}`}>
                            <Trash2 size={14} />
                          </button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {categoryTotals.length > 0 && (
              <div style={{ marginTop: 30 }}>
                <div className="ll-section-label"><span>Where it goes</span></div>
                {categoryTotals.map(([cat, amt]) => (
                  <div className="ll-cat-row" key={cat}>
                    <div className="ll-cat-top">
                      <span>{cat}</span>
                      <span className="ll-amt" style={{ fontSize: 12.5 }}>{fmtMoney(amt)}/mo</span>
                    </div>
                    <div className="ll-catbar-track">
                      <div className="ll-catbar-fill" style={{ width: `${maxCategoryTotal ? (amt / maxCategoryTotal) * 100 : 0}%` }} />
                    </div>
                  </div>
                ))}
              </div>
            )}

            <div className="ll-footer">
              <span>Kept privately on this device's account — visible only to you.</span>
              {entries.length > 0 && (
                <button className="ll-reset" onClick={() => setConfirmResetOpen(true)}>Clear all entries</button>
              )}
            </div>
          </div>

          {confirmResetOpen && (
            <div className="ll-modal-backdrop" onClick={() => setConfirmResetOpen(false)}>
              <div className="ll-modal" onClick={(e) => e.stopPropagation()}>
                <h3>Clear the ledger?</h3>
                <p>This removes every entry you've recorded. This can't be undone.</p>
                <div className="ll-formbtns">
                  <button className="ll-btn-primary" style={{ background: "#A63A2E" }} onClick={resetAll}>Clear everything</button>
                  <button className="ll-btn-ghost" onClick={() => setConfirmResetOpen(false)}>Keep entries</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<LeakLedger />);
  </script>
</body>
</html>
