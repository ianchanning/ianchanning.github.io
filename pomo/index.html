<!doctype html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e5e5e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />    
    <title>Lock Stock Pomodoros : ianchanning</title>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="images/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="images/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="images/favicon-16x16.png"
    />
    <link rel="manifest" href="site.webmanifest" />
    <style type="text/css">
      body {
        color: #333;
        font-size: 1rem;
        margin: 2.5rem auto;
        max-width: 720px;
        line-height: 1.5;
        font-family: system-ui, sans-serif;
        padding: 0.625rem 1rem;
      }
      h1,
      h2,
      h3 {
        line-height: 1.2;
      }
      a {
        text-decoration: none;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-weight: normal;
      }
      table {
        border-spacing: 0;
        border-collapse: collapse;
      }
      th,
      td {
        border-top: 1px solid #ddd;
        padding: 0.625rem 1rem;
      }
      fieldset {
        padding: 0.625rem 1rem;
        border: none;
      }
      input,
      textarea,
      select,
      button {
        font-family: system-ui, sans-serif;
        font-size: 1rem;
        padding: 0.5rem 1rem;
        line-height: 1.5;
      }
      label,
      button {
        margin-top: 10px;
        margin-right: 10px;
      }
      label {
        display: block;
      }
      input,
      textarea {
        width: 96%;
      }
      select {
        width: 100%;
      }
      label input {
        width: auto;
      }
      ul.tabs {
        display: flex;
        padding: 0;
        margin: 0 0 0.625rem 0;
        list-style: none;
      }

      ul.tabs li a {
        padding: 0.5rem 1rem;
        display: inline-block;
      }

      ul.tabs li a.active {
        color: #333;
      }

      .tab-content {
        display: none;
      }

      .tab-content.active {
        display: block;
      }
    </style>
    <style type="text/css">
      /* <details> is a block, but the "+" belongs on the buttons row. Inline
         keeps it there; the blockquote inside is still a block, so the opened
         reminder breaks the line and lands underneath where it always was. */
      .reminder {
        display: inline;
      }

      .reminder > summary {
        cursor: pointer;
        display: inline;
        font-family: ui-monospace, monospace;
        list-style: none;
      }

      .reminder > summary::-webkit-details-marker {
        display: none;
      }

      .reminder > summary::after {
        content: "+";
      }

      .reminder[open] > summary::after {
        content: "\00D7";
      }

      #min,
      #sec,
      #pomo {
        appearance: textfield;
        border: 1px solid #767676;
        border-radius: 2px;
        display: inline-block;
        font-size: 1rem;
        line-height: 1.5;
        padding: 0.5rem 1rem;
        width: 2ch;
      }
      input[type=number]::-webkit-inner-spin-button, 
      input[type=number]::-webkit-outer-spin-button { 
        -webkit-appearance: none; 
        margin: 0; 
      }

      /* Elm emits no whitespace between elements, so the boxes would otherwise
         touch. The old markup got this gap free from newlines in the HTML. */
      .time .separator {
        margin: 0 0.25rem;
      }

      figcaption {
        font-size: 80%;
        color: #999;
      }

      .notifications blockquote {
        quotes: "\201C" "\201D";
      }

      .notifications .quote::before {
        content: open-quote;
      }

      .notifications .quote::after {
        content: close-quote;
      }
    </style>
    <script src="main.js" defer></script>
    <script src="app.js" defer></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js", { scope: "./" })
            .then((registration) => {
              console.info("Pomodoro service worker registered:", registration.scope);
            })
            .catch((error) => {
              console.error("Pomodoro service worker registration failed:", error);
            });
        });
      }
    </script>
  </head>
  <body></body>
</html>
